[package]
name = "rascal-map"
version = "0.1.0"
edition = "2024"
description = "Draw ASCII art maps of the world, continents and countries in the terminal"
license = "MIT"
authors = ["Ali Raheem"]
repository = "https://github.com/ali-raheem/rascal"
readme = "README.md"
keywords = ["ascii-art", "map", "world-map", "terminal", "cli"]
categories = ["command-line-utilities", "visualization"]
exclude = ["/scripts", "/.gitignore"]

[[bin]]
name = "rascal"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal_size = "0.4"
toml = "0.8"

[profile.release]
lto = true
